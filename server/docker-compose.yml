services:
  app:
    build: .
    restart: unless-stopped
    shm_size: 2gb
    environment:
      HOST: 0.0.0.0
      DOUYIN_DATA_ROOT: /app/data
      H264_ENCODER: ${H264_ENCODER:-auto}
    volumes:
      - app_data:/app/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-http://localhost:8080}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
      - "${BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${BIND_ADDRESS:-127.0.0.1}:443:443"
      - "${BIND_ADDRESS:-127.0.0.1}:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
