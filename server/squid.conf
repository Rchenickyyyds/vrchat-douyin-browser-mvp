# Only the isolated worker network can reach this unpublished port.
http_port 3128
acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT
acl blocked_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny manager
http_access deny blocked_dst
http_access allow all
cache deny all
access_log none
cache_log /dev/stderr
pid_filename /tmp/squid.pid
coredump_dir /tmp
logfile_rotate 0
pinger_enable off
shutdown_lifetime 1 seconds
visible_hostname browser-egress
